version: 2

updates:

  # Python deps in python/pyproject.toml.
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  # TypeScript deps in typescript/package.json.
  - package-ecosystem: npm
    directory: /typescript
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  # Go modules in go/go.mod.
  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  # NuGet packages for the C# project.
  - package-ecosystem: nuget
    directory: /csharp
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  # GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  # Dockerfile base-image updates per language.
  - package-ecosystem: docker
    directory: /python
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /typescript
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /go
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /csharp
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
