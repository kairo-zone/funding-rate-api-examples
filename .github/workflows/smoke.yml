name: Smoke

# End-to-end smoke test: builds each language image and runs example 01
# against the production API. Requires the `KAIRO_FUNDING_API_KEY` repo
# secret. Without the secret, all jobs short-circuit gracefully via the
# `prep` job's output (the `secrets` context is not allowed in job-level
# `if` conditionals — checking secret presence must happen inside a step).

on:
  workflow_dispatch:
  schedule:
    # Mondays at 12:00 UTC. Catches API drift without burning rate limits.
    - cron: "0 12 * * 1"

permissions:
  contents: read

concurrency:
  group: smoke
  cancel-in-progress: true

jobs:

  prep:
    name: "Smoke · prep"
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.check.outputs.has_key }}
    steps:
      - id: check
        env:
          API_KEY: ${{ secrets.KAIRO_FUNDING_API_KEY }}
        run: |
          if [ -n "$API_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
            echo "KAIRO_FUNDING_API_KEY is set; smoke jobs will run."
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KAIRO_FUNDING_API_KEY secret is not set; smoke jobs will be skipped."
          fi

  python:
    name: "Smoke · python"
    needs: prep
    if: needs.prep.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    env:
      KAIRO_FUNDING_API_KEY: ${{ secrets.KAIRO_FUNDING_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker compose build python
      - name: Run example 01
        run: |
          set +e
          docker compose run --rm -e KAIRO_FUNDING_API_KEY python \
            > out.log 2>&1
          code=$?
          echo "::group::last 30 lines of stdout"
          tail -n 30 out.log
          echo "::endgroup::"
          exit "$code"

  typescript:
    name: "Smoke · typescript"
    needs: prep
    if: needs.prep.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    env:
      KAIRO_FUNDING_API_KEY: ${{ secrets.KAIRO_FUNDING_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker compose build typescript
      - name: Run example 01
        run: |
          set +e
          docker compose run --rm -e KAIRO_FUNDING_API_KEY typescript \
            > out.log 2>&1
          code=$?
          echo "::group::last 30 lines of stdout"
          tail -n 30 out.log
          echo "::endgroup::"
          exit "$code"

  go:
    name: "Smoke · go"
    needs: prep
    if: needs.prep.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    env:
      KAIRO_FUNDING_API_KEY: ${{ secrets.KAIRO_FUNDING_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker compose build go
      - name: Run example 01
        run: |
          set +e
          docker compose run --rm -e KAIRO_FUNDING_API_KEY go \
            > out.log 2>&1
          code=$?
          echo "::group::last 30 lines of stdout"
          tail -n 30 out.log
          echo "::endgroup::"
          exit "$code"

  csharp:
    name: "Smoke · csharp"
    needs: prep
    if: needs.prep.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    env:
      KAIRO_FUNDING_API_KEY: ${{ secrets.KAIRO_FUNDING_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker compose build csharp
      - name: Run example 01
        run: |
          set +e
          docker compose run --rm -e KAIRO_FUNDING_API_KEY csharp \
            > out.log 2>&1
          code=$?
          echo "::group::last 30 lines of stdout"
          tail -n 30 out.log
          echo "::endgroup::"
          exit "$code"

  summary:
    name: "Smoke · summary"
    needs: [prep, python, typescript, go, csharp]
    if: always() && needs.prep.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Compose summary
        id: status
        run: |
          if [ "${{ needs.python.result }}" = "success" ] \
            && [ "${{ needs.typescript.result }}" = "success" ] \
            && [ "${{ needs.go.result }}" = "success" ] \
            && [ "${{ needs.csharp.result }}" = "success" ]; then
            echo "msg=smoke ok" >> "$GITHUB_OUTPUT"
          else
            echo "msg=smoke failed (py=${{ needs.python.result }} ts=${{ needs.typescript.result }} go=${{ needs.go.result }} cs=${{ needs.csharp.result }})" >> "$GITHUB_OUTPUT"
          fi

      - name: Write job summary
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const msg = `${{ steps.status.outputs.msg }}`;
            core.summary.addRaw(`Smoke result: ${msg}`).write();
