name: Smoke

# End-to-end smoke test: builds each language image and runs example 01
# against the production API. Requires the `KAIRO_FUNDING_API_KEY` repo
# secret. Without the secret, all jobs short-circuit gracefully.

on:
  workflow_dispatch:
  schedule:
    # Mondays at 12:00 UTC. Catches API drift without burning rate limits.
    - cron: "0 12 * * 1"

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: smoke
  cancel-in-progress: true

jobs:

  python:
    name: "Smoke · python"
    runs-on: ubuntu-latest
    if: ${{ secrets.KAIRO_FUNDING_API_KEY != '' }}
    env:
      KAIRO_FUNDING_API_KEY: ${{ secrets.KAIRO_FUNDING_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker compose build python
      - name: Run example 01
        run: |
          set +e
          docker compose run --rm -e KAIRO_FUNDING_API_KEY python \
            > out.log 2>&1
          code=$?
          echo "::group::last 30 lines of stdout"
          tail -n 30 out.log
          echo "::endgroup::"
          exit "$code"

  typescript:
    name: "Smoke · typescript"
    runs-on: ubuntu-latest
    if: ${{ secrets.KAIRO_FUNDING_API_KEY != '' }}
    env:
      KAIRO_FUNDING_API_KEY: ${{ secrets.KAIRO_FUNDING_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker compose build typescript
      - name: Run example 01
        run: |
          set +e
          docker compose run --rm -e KAIRO_FUNDING_API_KEY typescript \
            > out.log 2>&1
          code=$?
          echo "::group::last 30 lines of stdout"
          tail -n 30 out.log
          echo "::endgroup::"
          exit "$code"

  go:
    name: "Smoke · go"
    runs-on: ubuntu-latest
    if: ${{ secrets.KAIRO_FUNDING_API_KEY != '' }}
    env:
      KAIRO_FUNDING_API_KEY: ${{ secrets.KAIRO_FUNDING_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker compose build go
      - name: Run example 01
        run: |
          set +e
          docker compose run --rm -e KAIRO_FUNDING_API_KEY go \
            > out.log 2>&1
          code=$?
          echo "::group::last 30 lines of stdout"
          tail -n 30 out.log
          echo "::endgroup::"
          exit "$code"

  csharp:
    name: "Smoke · csharp"
    runs-on: ubuntu-latest
    if: ${{ secrets.KAIRO_FUNDING_API_KEY != '' }}
    env:
      KAIRO_FUNDING_API_KEY: ${{ secrets.KAIRO_FUNDING_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker compose build csharp
      - name: Run example 01
        run: |
          set +e
          docker compose run --rm -e KAIRO_FUNDING_API_KEY csharp \
            > out.log 2>&1
          code=$?
          echo "::group::last 30 lines of stdout"
          tail -n 30 out.log
          echo "::endgroup::"
          exit "$code"

  summary:
    name: "Smoke · summary"
    runs-on: ubuntu-latest
    needs: [python, typescript, go, csharp]
    if: always()
    steps:
      - name: Compose summary
        id: status
        run: |
          if [ "${{ needs.python.result }}" = "success" ] \
            && [ "${{ needs.typescript.result }}" = "success" ] \
            && [ "${{ needs.go.result }}" = "success" ] \
            && [ "${{ needs.csharp.result }}" = "success" ]; then
            echo "msg=smoke ok" >> "$GITHUB_OUTPUT"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "msg=smoke failed (py=${{ needs.python.result }} ts=${{ needs.typescript.result }} go=${{ needs.go.result }} cs=${{ needs.csharp.result }})" >> "$GITHUB_OUTPUT"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          echo "${{ steps.status.outputs.msg }}"

      - name: Post status comment
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const msg = `${{ steps.status.outputs.msg }}`;
            core.summary.addRaw(`Smoke result: ${msg}`).write();
            // For scheduled runs there is no PR/issue to comment on, so we
            // only post a comment when a related issue number is supplied
            // via dispatch input (omitted here) - the job summary above is
            // always written. This keeps the step non-blocking.
